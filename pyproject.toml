[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plateforge"
version = "0.1.0"
description = "Antibody discovery workflow toolkit: sequence library, plate assays, reagent reasoning, instrument file emission"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jsonschema>=4.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# openpyxl is in `dev` deliberately: the tests that check our sequencing order
# forms against the vendors' own .xlsx templates are the whole reason those
# emitters can be called `verified`, and silently skipping them would give that
# word away for nothing.
dev = ["pytest>=7.0", "ruff>=0.4", "openpyxl>=3.1"]
# Reading the HuggingFace parquet mirror of OAS. Optional because everything
# else -- including the whole test suite -- runs without network access.
hf = ["huggingface_hub>=0.23", "fsspec>=2024.2"]
# IMGT germline reference sequences, bundled as data inside anarci. Optional
# because the pool-consensus fallback still works without it -- but every
# alignment reference and the vector's light chain are better with it.
imgt = ["anarci"]
# The baseline classifier in scripts/simulate_elisa.py. Optional because the
# simulator itself, and every test, runs without it.
ml = ["scikit-learn>=1.3", "pyarrow>=14", "joblib>=1.3", "openpyxl>=3.1"]
# Writing vendor Sanger order forms as .xlsx. Optional because the `generic`
# CSV form needs nothing, and reading .ab1 traces needs nothing either --
# `library.abif` parses ABIF directly rather than taking a dependency.
sequencing = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plateforge.core" = ["schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
