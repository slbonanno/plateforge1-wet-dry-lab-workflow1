[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plateforge"
version = "0.1.0"
description = "Antibody discovery workflow toolkit: sequence library, plate assays, reagent reasoning, instrument file emission"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jsonschema>=4.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
# Reading the HuggingFace parquet mirror of OAS. Optional because everything
# else -- including the whole test suite -- runs without network access.
hf = ["huggingface_hub>=0.23", "fsspec>=2024.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"plateforge.core" = ["schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
